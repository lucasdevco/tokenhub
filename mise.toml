[tools]
go = "1.27.1"
node = "24.14.1"
# Use the JavaScript distribution, which also supports Intel Macs.
"npm:pnpm" = "11.8.0"

[tasks."install:web"]
description = "Install frontend dependencies from the lockfile"
env = { CI = "true" }
run = "pnpm --dir web install --frozen-lockfile"

[tasks.setup]
description = "Download Go and frontend dependencies"
depends = ["install:web"]
run = [
  "go mod download",
  "cd desktop && go mod download",
]

[tasks."build:web"]
description = "Build the embedded React frontend"
depends = ["install:web"]
run = "pnpm --dir web build"

[tasks.build]
description = "Build the macOS app and DMG with the embedded frontend"
depends = ["desktop"]

[tasks.desktop]
description = "Package the macOS menu-bar app and disk image"
depends = ["build:web"]
dir = "desktop"
run = "go run github.com/egoist/mygo/cmd/mygo@v0.4.8 build"

[tasks."dev:web"]
description = "Start Vite with hot reload (run dev:desktop in another terminal)"
depends = ["install:web"]
run = "pnpm --dir web dev"

[tasks."dev:desktop"]
description = "Run the native menu-bar shell without packaging the macOS app"
depends = ["build:web"]
dir = "desktop"
run = "go run ."

[tasks.test]
description = "Run Go and frontend regression tests"
depends = ["build:web"]
run = [
  "go test ./...",
  "pnpm --dir web test",
]

[tasks."generate:sql"]
description = "Generate typed SQLite queries with the pinned sqlc version"
run = "go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate"
