name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag version to build (e.g. 0.1.1, without v; empty builds the selected ref)"
        type: string
      publish:
        description: "Publish a release after building (off: build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && !inputs.publish }}

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve source and version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          ref="$GITHUB_SHA"
          publish=false
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
            ref="refs/tags/v$version"
            publish="$INPUT_PUBLISH"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_EVENT_NAME" == push || "$INPUT_PUBLISH" == true ]]; then
              publish=true
            fi
          else
            version="0.0.0-dev.${GITHUB_SHA:0:7}"
            if [[ "$INPUT_PUBLISH" == true ]]; then
              echo "Select an existing version tag to publish" >&2
              exit 1
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version such as 0.1.1 or 0.1.1-rc.1" >&2
            exit 1
          fi
          ref="$(git rev-parse --verify "$ref^{commit}")"
          {
            echo "version=$version"
            echo "ref=$ref"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Checkout packaging tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-macos-${{ matrix.arch }}-${{ hashFiles('mise.toml', 'go.sum', 'desktop/go.sum') }}
          restore-keys: go-macos-${{ matrix.arch }}-

      - name: Set package version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const path = "desktop/mygo.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Build CLI, app, and DMG
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mise run build
      - name: Require signed updates for publishing
        if: needs.prepare.outputs.publish == 'true'
        run: test -f "build/darwin-${{ matrix.arch }}/update-darwin-${{ matrix.arch }}.json"
      - name: Check frontend
        run: |
          pnpm --dir web fmt:check
          pnpm --dir web test
      - name: Test Go modules
        run: |
          go test ./...
          (cd desktop && go test ./...)
      - name: Package and verify artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          REQUIRE_UPDATES: ${{ needs.prepare.outputs.publish }}
        run: bash .release-tools/scripts/package-macos.sh "$VERSION" "$EXPECTED_ARCH" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v7
        with:
          name: build-darwin-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - name: Checkout release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: build-darwin-*
          merge-multiple: true
          path: release
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        working-directory: release
        run: |
          set -euo pipefail
          cat SHA256SUMS-* > SHA256SUMS
          rm SHA256SUMS-*
          sha256sum --check SHA256SUMS
          notes="$RUNNER_TEMP/release-notes.md"
          python3 ../.release-tools/scripts/release-notes.py "$TAG" > "$notes"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --notes-file "$notes" --title "tokenhub $TAG"
          fi
          gh release upload "$TAG" ./* --clobber
          gh release edit "$TAG" --notes-file "$notes" --title "tokenhub $TAG"
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            latest_tag="$(
              { gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName'; echo "$TAG"; } |
                sort -V | tail -n 1
            )"
            latest=false
            if [[ "$TAG" == "$latest_tag" ]]; then
              latest=true
            fi
            gh release edit "$TAG" --draft=false --prerelease=false --latest="$latest"
          fi
